name: automerge

on:
  pull_request:
    branches: [develop]

permissions:
  contents: write
  pull-requests: write

env:
  NODE_VERSION: 22

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Get changed files
        id: changes-files
        run: |
          git fetch origin develop

          FILES=$(git diff --name-only origin/develop...HEAD)
          
          # All files must be in assets/*.json
          INVALID=$(echo "$FILES" | grep -vE '^assets/[^/]+\.json$' || true)
          if [ -n "$INVALID" ]; then
            echo "Invalid files detected:"
            echo "$INVALID"
            exit 1
          fi

          # Update exactly one file
          COUNT=$(echo "$FILES" | grep -cE '^assets/[^/]+\.json$' || true)
          if [ "$COUNT" -ne 1 ]; then
            echo "Expected exactly 1 JSON file, got $COUNT"
            exit 1
          fi

          echo "CHANGED_JSON_FILE=$FILES" >> $GITHUB_ENV

      - name: Install dependencies
        run: npm clean-install

      - name: Validate the changed files
        run: |
          echo "Changed JSON file: $CHANGED_JSON_FILE"
          CHANGED_JSON_FILE=$CHANGED_JSON_FILE npm run test:automerge

  automerge:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Automerge
        run: |
          gh pr merge ${{ github.event.pull_request.number }} --merge --auto
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}