name: automerge

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

env:
  NODE_VERSION: 22

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Get changed files
        id: changes-files
        run: |
          echo "CHANGED_JSON_FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep '\.json$' || true)" >> $GITHUB_ENV

      - name: Install dependencies
        run: npm clean-install

      - name: Validate the changed files
        run: |
          echo "Changed JSON files: $CHANGED_JSON_FILES"
          CHANGED_JSON_FILES=$CHANGED_JSON_FILES npm run test:automerge